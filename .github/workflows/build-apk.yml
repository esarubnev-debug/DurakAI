
name: Build Durak AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DurakAI_phone_build_project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Unpack project
        run: unzip -q DurakAI_phone_build_project.zip -d project

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DurakAI-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
